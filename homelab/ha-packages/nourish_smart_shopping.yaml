# rest_command + supermarket zone automations
# nourish_despensa_check + input_number live in configuration.yaml

rest_command:
  # Supermarket arrival → Markety's own Web Push with the pending list (was the n8n webhook
  # that sent a Companion notification). Name kept: the per-store automations call it.
  # `store` is the tracker state, i.e. the zone's friendly name ("Auchan").
  nourish_at_supermarket:
    url: "http://192.168.1.27:8788/arrival"
    method: POST
    content_type: "application/json"
    payload: "{{ {'store': states('device_tracker.telemovel_francisco')} | to_json }}"
    timeout: 30
  nourish_event_supermarket_enter:
    url: "http://192.168.1.27:8787/event"
    method: POST
    content_type: "application/json"
    payload: '{"type":"supermarket_enter","zone":"zone.auchan"}'
    timeout: 15
  nourish_event_supermarket_leave:
    url: "http://192.168.1.27:8787/event"
    method: POST
    content_type: "application/json"
    payload: '{"type":"supermarket_leave"}'
    timeout: 15
  nourish_event_supermarket_zone:
    url: "http://192.168.1.27:8787/event"
    method: POST
    content_type: "application/json"
    payload: "{{ body }}"
    timeout: 15
  nourish_event_leave_home:
    url: "http://192.168.1.27:8787/event"
    method: POST
    content_type: "application/json"
    payload: '{"type":"leave_home"}'
    timeout: 15

automation:
  # NOTE: triggers are STATE-based, not `platform: zone`. The phone's
  # device_tracker (source_type: gps) exposes only `in_zones` + a state label
  # and carries NO latitude/longitude, so `platform: zone` triggers can never
  # fire (they need coordinates). The tracker's STATE does flip reliably to the
  # zone's friendly name ("Auchan"), so we trigger on that — same approach the
  # home arrive/leave automations use. This is why detection silently died after
  # the 2026-06-15 presence rework swapped in the coordinate-less tracker.
  #
  # `for: 2 minutes` blocks drive-bys from opening a visit / shopping list.
  # Shopping list is sent only by per-store automations from Nourish
  # (ha-supermarket-zone.mjs) so Auchan is not notified twice.
  - id: nourish_supermarket_arrival
    alias: "Nourish — chegada ao supermercado"
    description: Regista visita Auchan após 2 min na zona (sem lista — ver automação por loja)
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: device_tracker.telemovel_francisco
        to: "Auchan"
        for:
          minutes: 2
    action:
      - action: rest_command.nourish_event_supermarket_enter

  - id: nourish_supermarket_departure
    alias: "Nourish — saída do supermercado"
    description: Fecha visita no historial (hora de saída e duração)
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: device_tracker.telemovel_francisco
        from: "Auchan"
    action:
      - action: rest_command.nourish_event_supermarket_leave
